<header class="entete">
  <div class="marque">
    <!-- Un solstice : le disque solaire au plus haut de sa course sur la
         ligne d'horizon. La marque vient du nom, pas d'un catalogue. -->
    <svg class="sceau" viewBox="0 0 24 24" aria-hidden="true">
      <path d="M4 17 H20" />
      <path d="M12 17 A6 6 0 0 1 12 5 A6 6 0 0 1 12 17" />
      <path d="M12 2 V4  M20.5 8.5 L19 9.5  M3.5 8.5 L5 9.5" />
    </svg>
    <div class="titres">
      <span class="nom">Mutuelle Solstice</span>
      <span class="role">Assistant</span>
    </div>
  </div>

  <div class="actions">
    @if (conversation.tours().length > 0) {
      <button type="button" class="recommencer" (click)="conversation.recommencer()">
        Nouvelle conversation
      </button>
    }
  </div>
</header>

<main class="plateau">
  <div class="colonne">
    <router-outlet />
  </div>
  <app-inspection class="panneau-place" />
</main>
